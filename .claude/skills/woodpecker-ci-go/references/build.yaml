---
when:
  - branch:
      - main
      - develop
    event:
      - push
  - event:
      - pull_request
      - tag

variables:
  - &golang "golang:1.26-alpine"
  - &reviewdog_golangci_lint "woodpeckerci/plugin-reviewdog-golangci-lint:2.11"
  - &golangci_lint "golangci/golangci-lint:v2.11"
  - &trivy "git.zzdats.lv/woodpeckerci/trivy:latest"
  - &docker_build "woodpeckerci/plugin-docker-buildx:latest"
  - &cosign_image "git.zzdats.lv/woodpeckerci/cosign-sign:1.0.0"
  - &sonar_scanner "sonarsource/sonar-scanner-cli:latest"
  - &gitea_sq_report_image "git.zzdats.lv/internal/gitea-sq-reporter:latest"
  - &send_report_image "curlimages/curl:latest"
  - &scan_result_image "alpine:latest"
  - &report_image "node:24.14"

steps:
  - name: dependency-security-check
    image: *trivy
    pull: true
    environment:
      TRIVY_DB_REPOSITORY: git.zzdats.lv/woodpeckerci/trivy-db:2
      TRIVY_JAVA_DB_REPOSITORY: git.zzdats.lv/woodpeckerci/trivy-java-db:1
      TRIVY_CHECKS_BUNDLE_REPOSITORY: git.zzdats.lv/woodpeckerci/trivy-checks:0
      TRIVY_USERNAME: token
      TRIVY_PASSWORD:
        from_secret: package_token
    commands:
      - echo "DEPENDENCY_SCAN_STATUS=1" >> sharedenv
      - trivy fs --exit-code 0 --skip-dirs vendor,node_modules --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL -f json -o trivy_dependency_report.json .
      - trivy fs --skip-dirs vendor --exit-code 0 --severity UNKNOWN,LOW,MEDIUM .
      - trivy fs --skip-dirs vendor --exit-code 1 --severity HIGH,CRITICAL .
      - sed -i "s|DEPENDENCY_SCAN_STATUS=1|DEPENDENCY_SCAN_STATUS=0|g" sharedenv
    when:
      branch:
        - develop
      event:
        - pull_request

  - name: send-trivy-dependency-report
    image: *send_report_image
    environment:
      COREPACK_DEFAULT_TO_LATEST: 0
      DEFECT_PORTAL_DOJO_TOKEN:
        from_secret: defect_portal_dojo_token
    commands:
      - |
        response=$(curl -L -X POST "https://defect-portal.zzdats.lv/api/v2/reimport-scan/" \
        -H "Authorization: Token $DEFECT_PORTAL_DOJO_TOKEN" \
        -F "scan_type=Trivy Scan" \
        -F "file=@trivy_dependency_report.json" \
        -F "scan_date=$(date -u +"%Y-%m-%d")" \
        -F "auto_create_context=True" \
        -F "product_name=${CI_REPO_OWNER}-${CI_REPO_NAME}" \
        -F "product_type_name=${CI_REPO_OWNER}" \
        -F "engagement_name=Trivy Dependency Scan" \
        -w "%{http_code}" -o /dev/null -s)
        if [ "$response" -eq 200 ] || [ "$response" -eq 201 ]; then
          echo "Request was successful."
        else
          echo "Request failed with response code $response."
          exit 1
        fi
    when:
      branch:
        - develop
      event:
        - pull_request

  - name: vendor
    image: *golang
    pull: true
    environment:
      GOPRIVATE: git.zzdats.lv
      PACKAGE_TOKEN:
        from_secret: package_token
    commands:
      - apk --no-cache add git
      - git config --global url."https://$${PACKAGE_TOKEN}@git.zzdats.lv/".insteadOf https://git.zzdats.lv/
      - go mod vendor
    when:
      branch:
        - main
        - develop
      event:
        - pull_request
        - push

  - name: generate
    image: *golang
    environment:
      CGO_ENABLED: 0
    commands:
      - go generate ./...
    when:
      branch:
        - main
        - develop
      event:
        - pull_request
        - push

  - name: build
    image: *golang
    environment:
      CGO_ENABLED: 0
    commands:
      - go build -ldflags="-w -s" -tags 'netgo osusergo' -o publish/server ./cmd/server/...
    when:
      branch:
        - main
        - develop
      event:
        - pull_request
        - push

  - name: review-go
    image: *reviewdog_golangci_lint
    pull: true
    settings:
      token:
        from_secret: reviewdog_token
      timeout: 90s
    when:
      branch:
        - develop
      event:
        - pull_request

  - name: lint
    image: *golangci_lint
    pull: true
    environment:
      PACKAGE_TOKEN:
        from_secret: package_token
    commands:
      - golangci-lint run --timeout 3m --output.checkstyle.path=golangci-lint.out --output.text.colors --output.text.path stdout
    when:
      branch:
        - develop
      event:
        - pull_request
        - push

  - name: test
    image: *golang
    pull: true
    environment:
      CGO_ENABLED: 0
    commands:
      - "go test -race -tags 'netgo osusergo' -cover -coverprofile=coverage.out -covermode=atomic -json ./... > report.json"
    when:
      branch:
        - develop
      event:
        - pull_request
        - push

  - name: test-results
    image: *golang
    commands:
      - apk --no-cache add git
      - go install github.com/mfridman/tparse@latest
      - "tparse -all -file report.json || true"
    when:
      status: failure

  - name: sonarqube-code-check-pr
    image: *sonar_scanner
    pull: true
    commands:
      - sonar-scanner
        -D "sonar.sources=./"
        -D "sonar.working.directory=/tmp"
        -D "sonar.exclusions=vendor/**,.git/**,publish/**,**/*.gen.go"
        -D "sonar.tests=."
        -D "sonar.test.inclusions=**/*_test.go"
        -D "sonar.go.coverage.reportPaths=coverage.out"
        -D "sonar.go.golangci-lint.reportPaths=golangci-lint.out"
        -D "sonar.go.tests.reportPaths=report.json"
        -D "sonar.projectKey=${CI_REPO_OWNER}-${CI_REPO_NAME}"
        -D "sonar.projectName=${CI_REPO_OWNER}/${CI_REPO_NAME}"
        -D "sonar.sourceEncoding=UTF-8"
        -D "sonar.projectVersion=${CI_PIPELINE_NUMBER}"
        -D "sonar.token=$${SONAR_TOKEN}"
        -D "sonar.host.url=https://sq.zzdats.lv/"
        -D "sonar.qualitygate.wait=true"
        -D "sonar.qualitygate.timeout=180"
        -D "sonar.pullrequest.key=${CI_COMMIT_PULL_REQUEST}"
        -D "sonar.pullrequest.branch=${CI_COMMIT_SOURCE_BRANCH}"
        -D "sonar.pullrequest.base=${CI_COMMIT_TARGET_BRANCH}" || true
    environment:
      SONAR_TOKEN:
        from_secret: sonar_token
    when:
      branch:
        - ${CI_REPO_DEFAULT_BRANCH}
      event:
        - pull_request

  - name: sonarqube-code-check-pr-comment-summary
    image: *gitea_sq_report_image
    pull: true
    settings:
      sonar_host_url: https://sq.zzdats.lv
      sonar_token:
        from_secret: sonar_token
      gitea_token:
        from_secret: reviewdog_token
    when:
      branch:
        - ${CI_REPO_DEFAULT_BRANCH}
      event:
        - pull_request

  - name: sonarqube-code-check
    image: *sonar_scanner
    pull: true
    environment:
      SONAR_TOKEN:
        from_secret: sonar_token
    commands:
      - sonar-scanner
        -D "sonar.sources=./"
        -D "sonar.working.directory=/tmp"
        -D "sonar.exclusions=vendor/**,**/*.gen.go"
        -D "sonar.tests=."
        -D "sonar.test.inclusions=**/*_test.go"
        -D "sonar.go.coverage.reportPaths=coverage.out"
        -D "sonar.go.golangci-lint.reportPaths=golangci-lint.out"
        -D "sonar.go.tests.reportPaths=report.json"
        -D "sonar.projectKey=${CI_REPO_OWNER}-${CI_REPO_NAME}"
        -D "sonar.projectName=${CI_REPO_OWNER}/${CI_REPO_NAME}"
        -D "sonar.sourceEncoding=UTF-8"
        -D "sonar.projectVersion=${CI_PIPELINE_NUMBER}"
        -D "sonar.token=$${SONAR_TOKEN}"
        -D "sonar.host.url=https://sq.zzdats.lv/"
        -D "sonar.qualitygate.wait=true"
        -D "sonar.qualitygate.timeout=180"
    when:
      branch: ${CI_REPO_DEFAULT_BRANCH}
      event: push

  - name: sonarqube-code-check-send-report
    image: *report_image
    pull: true
    environment:
      SONAR_TOKEN:
        from_secret: sonar_token
      DEFECT_PORTAL_DOJO_TOKEN:
        from_secret: defect_portal_dojo_token
    commands:
      - npm install -g sonar-report
      - |
        sonar-report \
        --sonarurl="https://sq.zzdats.lv" \
        --sonartoken="$SONAR_TOKEN" \
        --sonarcomponent="${CI_REPO_OWNER}-${CI_REPO_NAME}" \
        --output="report.html"
      - |
        response=$(curl -L -X POST "https://defect-portal.zzdats.lv/api/v2/reimport-scan/" \
        -H "Authorization: Token $DEFECT_PORTAL_DOJO_TOKEN" \
        -F "scan_type=SonarQube Scan detailed" \
        -F "file=@report.html" \
        -F "scan_date=$(date -u +"%Y-%m-%d")" \
        -F "auto_create_context=True" \
        -F "product_name=${CI_REPO_OWNER}-${CI_REPO_NAME}" \
        -F "product_type_name=${CI_REPO_OWNER}" \
        -F "engagement_name=SonarQube Scan detailed" \
        -w "%{http_code}" -o /dev/null -s)
        if [ "$response" -eq 200 ] || [ "$response" -eq 201 ]; then
          echo "SonarQube report submission was successful."
        else
          echo "SonarQube report submission failed with response code $response."
          exit 1
        fi
    when:
      branch: ${CI_REPO_DEFAULT_BRANCH}
      event: push

  - name: docker-dryrun
    image: *docker_build
    pull: true
    settings:
      repo: git.zzdats.lv/${CI_REPO_OWNER}/${CI_REPO_NAME}
      tags: test
      dry_run: true
      output: type=docker,dest=${CI_REPO_OWNER}-${CI_REPO_NAME}.tar
    when:
      branch:
        - develop
      event:
        - pull_request

  - name: docker-image-security-check
    image: *trivy
    pull: true
    environment:
      TRIVY_DB_REPOSITORY: git.zzdats.lv/woodpeckerci/trivy-db:2
      TRIVY_JAVA_DB_REPOSITORY: git.zzdats.lv/woodpeckerci/trivy-java-db:1
      TRIVY_CHECKS_BUNDLE_REPOSITORY: git.zzdats.lv/woodpeckerci/trivy-checks:0
      TRIVY_USERNAME: token
      TRIVY_PASSWORD:
        from_secret: package_token
    commands:
      - echo "IMAGE_SCAN_STATUS=1" >> sharedenv
      - trivy image --exit-code 0 --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --input ${CI_REPO_OWNER}-${CI_REPO_NAME}.tar -f json -o trivy_image_report.json
      - trivy image --exit-code 0 --severity UNKNOWN,LOW,MEDIUM --input ${CI_REPO_OWNER}-${CI_REPO_NAME}.tar
      - trivy image --exit-code 1 --severity HIGH,CRITICAL --input ${CI_REPO_OWNER}-${CI_REPO_NAME}.tar
      - sed -i "s|IMAGE_SCAN_STATUS=1|IMAGE_SCAN_STATUS=0|g" sharedenv
    when:
      branch:
        - develop
      event:
        - pull_request

  - name: send-trivy-image-report
    image: *send_report_image
    environment:
      COREPACK_DEFAULT_TO_LATEST: 0
      DEFECT_PORTAL_DOJO_TOKEN:
        from_secret: defect_portal_dojo_token
    commands:
      - |
        response=$(curl -L -X POST "https://defect-portal.zzdats.lv/api/v2/reimport-scan/" \
        -H "Authorization: Token $DEFECT_PORTAL_DOJO_TOKEN" \
        -F "scan_type=Trivy Scan" \
        -F "file=@trivy_image_report.json" \
        -F "scan_date=$(date -u +"%Y-%m-%d")" \
        -F "auto_create_context=True" \
        -F "product_name=${CI_REPO_OWNER}-${CI_REPO_NAME}" \
        -F "product_type_name=${CI_REPO_OWNER}" \
        -F "engagement_name=Trivy Image Scan" \
        -w "%{http_code}" -o /dev/null -s)
        if [ "$response" -eq 200 ] || [ "$response" -eq 201 ]; then
          echo "Request was successful."
        else
          echo "Request failed with response code $response."
          exit 1
        fi
    when:
      branch:
        - develop
      event:
        - pull_request

  - name: vulnerability-scan-result-check
    image: *scan_result_image
    commands:
      - |
        source sharedenv
        if [ $DEPENDENCY_SCAN_STATUS -eq 1 ]; then
          echo "Dependency scan failed."
        fi
        if [ $IMAGE_SCAN_STATUS -eq 1 ]; then
          echo "Image scan failed."
        fi
        if [[ $DEPENDENCY_SCAN_STATUS -eq 1 || $IMAGE_SCAN_STATUS -eq 1 ]]; then
          exit 1
        fi
    when:
      branch:
        - develop
      event:
        - pull_request

  - name: docker-develop
    image: *docker_build
    pull: true
    settings:
      registry: git.zzdats.lv
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
      repo: git.zzdats.lv/${CI_REPO_OWNER}/${CI_REPO_NAME}
      tag:
        - develop
    when:
      branch:
        - develop
      event:
        - push

  - name: build-release
    image: *golang
    pull: true
    environment:
      CGO_ENABLED: "0"
      GOPRIVATE: git.zzdats.lv
      PACKAGE_TOKEN:
        from_secret: package_token
    commands:
      - apk --no-cache add git ca-certificates tzdata
      - git config --global url."https://$${PACKAGE_TOKEN}@git.zzdats.lv/".insteadOf https://git.zzdats.lv/
      - go mod download
      - go generate ./...
      - go build -ldflags="-w -s -X main.Version=${CI_COMMIT_TAG##v}" -tags 'netgo osusergo' -o publish/server ./cmd/server/...
      - mkdir -p publish/etc/ssl/certs/ publish/usr/share/zoneinfo/ publish/tmp/
      - cp /etc/ssl/certs/ca-certificates.crt publish/etc/ssl/certs/
      - cp -R /usr/share/zoneinfo publish/usr/share/
    when:
      event:
        - tag

  - name: docker-release
    image: *docker_build
    pull: true
    settings:
      registry: git.zzdats.lv
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
      repo: git.zzdats.lv/${CI_REPO_OWNER}/${CI_REPO_NAME}
      auto_tag: true
    when:
      event:
        - tag

  - name: sign release image
    image: *cosign_image
    settings:
      image: "git.zzdats.lv/${CI_REPO_OWNER}/${CI_REPO_NAME}:${CI_COMMIT_TAG##v}"
      registry: "git.zzdats.lv"
      registry_username:
        from_secret: docker_username
      registry_password:
        from_secret: docker_password
      hsm_connector: "hsm.zzdats.lv:12345"
      hsm_password:
        from_secret: hsm_password
      public_key:
        from_secret: cosign_public_key
      hsm_ca_cert_ignore: true
      rekor_url: "rekor.zzdats.lv"
      rekor_public_key:
        from_secret: rekor_public_key
    when:
      event:
        - tag
