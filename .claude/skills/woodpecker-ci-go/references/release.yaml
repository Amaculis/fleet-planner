---
when:
  event:
    - tag

variables:
  - &build_image golang:1.26-alpine
  - &docker_image woodpeckerci/plugin-docker-buildx:latest
  - &cosign_image git.zzdats.lv/woodpeckerci/cosign-sign:1.0.0

steps:
  - name: build
    image: *build_image
    pull: true
    environment:
      CGO_ENABLED: 0
      GOPRIVATE: git.zzdats.lv
      PACKAGE_TOKEN:
        from_secret: package_token
    commands:
      - apk --no-cache add git
      - git config --global url."https://$${PACKAGE_TOKEN}@git.zzdats.lv/".insteadOf https://git.zzdats.lv/
      - go mod download
      - go generate ./...
      - go build -ldflags="-w -s -X main.Version=${CI_COMMIT_TAG##v}" -tags 'netgo osusergo' -o publish/server ./cmd/server/...

  - name: docker-release
    image: *docker_image
    pull: true
    settings:
      registry: git.zzdats.lv
      repo: git.zzdats.lv/${CI_REPO_OWNER}/${CI_REPO_NAME}
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
      auto_tag: true

  - name: sign-release-image
    image: *cosign_image
    settings:
      image: "git.zzdats.lv/${CI_REPO_OWNER}/${CI_REPO_NAME}:${CI_COMMIT_TAG##v}"
      registry: "git.zzdats.lv"
      registry_username:
        from_secret: docker_username
      registry_password:
        from_secret: docker_password
      hsm_connector: "hsm.zzdats.lv:12345"
      hsm_password:
        from_secret: hsm_password
      public_key:
        from_secret: cosign_public_key
      hsm_ca_cert_ignore: true
      rekor_url: "rekor.zzdats.lv"
      rekor_public_key:
        from_secret: rekor_public_key
